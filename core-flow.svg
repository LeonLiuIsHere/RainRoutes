<g transform="translate(1020,150)"><rect width="420" height="680" rx="18" fill="white" stroke="#b9c8d8" stroke-width="2"/><rect width="420" height="64" rx="18" fill="#173c5b"/><text x="24" y="41" font-size="20" font-weight="700" fill="white">3 · Compare section schedules</text><text x="28" y="105" font-size="15" fill="#53677a">Only conflict-free combinations are marked valid</text><text x="28" y="145" font-size="15" font-weight="700" fill="#173c5b">Draft timetable · Option A</text><rect x="28" y="163" width="364" height="226" rx="8" fill="#fbfdff" stroke="#c7d5e0"/><line x1="83" y1="164" x2="83" y2="389" stroke="#d7e0e8"/><line x1="135" y1="164" x2="135" y2="389" stroke="#d7e0e8"/><line x1="187" y1="164" x2="187" y2="389" stroke="#d7e0e8"/><line x1="239" y1="164" x2="239" y2="389" stroke="#d7e0e8"/><line x1="291" y1="164" x2="291" y2="389" stroke="#d7e0e8"/><line x1="343" y1="164" x2="343" y2="389" stroke="#d7e0e8"/><text x="94" y="185" font-size="12" fill="#53677a">M</text><text x="147" y="185" font-size="12" fill="#53677a">T</text><text x="198" y="185" font-size="12" fill="#53677a">W</text><text x="251" y="185" font-size="12" fill="#53677a">T</text><text x="304" y="185" font-size="12" fill="#53677a">F</text><line x1="29" y1="236" x2="392" y2="236" stroke="#e2e8ee"/><line x1="29" y1="308" x2="392" y2="308" stroke="#e2e8ee"/><text x="37" y="228" font-size="11" fill="#66798a">9:00</text><text x="33" y="300" font-size="11" fill="#66798a">11:00</text><rect x="88" y="198" width="40" height="42" rx="4" fill="#dceef4"/><text x="92" y="223" font-size="10" fill="#205576">CPEN</text><rect x="192" y="254" width="40" height="48" rx="4" fill="#e2f2e8"/><text x="196" y="282" font-size="10" fill="#176140">MATH</text><rect x="296" y="198" width="40" height="42" rx="4" fill="#dceef4"/><text x="300" y="223" font-size="10" fill="#205576">CPEN</text><rect x="28" y="411" width="364" height="76" rx="9" fill="#eff8f3" stroke="#b9ddc7"/><text x="46" y="440" font-size="14" font-weight="700" fill="#176140">✓ No time conflict</text><text x="46" y="465" font-size="13" fill="#53677a">Friday preference met · Location data may be incomplete</text><text x="28" y="527" font-size="14" font-weight="700" fill="#173c5b">If no preferred schedule matches</text><text x="28" y="553" font-size="13" fill="#53677a">Show valid alternatives and name the preference</text><text x="28" y="574" font-size="13" fill="#53677a">that each alternative relaxes. Never hide conflicts.</text><rect x="28" y="612" width="174" height="46" rx="8" fill="#167d83"/><text x="58" y="641" font-size="15" font-weight="700" fill="white">Save draft plan</text><rect x="212" y="612" width="180" height="46" rx="8" fill="#eef3f7" stroke="#b9c8d8"/><text x="246" y="641" font-size="15" fill="#334b60">Edit selections</text></g>
</g></svg>

