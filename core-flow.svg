<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
<title id="title">Hortons Course Planner core flow sketch</title><desc id="desc">Low fidelity sketch of three planner screens: course history and preferences, eligible courses, and schedule comparison.</desc>
<rect width="1500" height="920" fill="#f4f7fb"/><text x="60" y="65" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#14304a">Hortons Course Planner — Core flow (low-fidelity)</text><text x="60" y="100" font-family="Arial,sans-serif" font-size="17" fill="#53677a">Illustrative only - example course codes, term, and timetable are not verified UBC offerings</text>
<g font-family="Arial,sans-serif">
<g transform="translate(60,150)"><rect width="420" height="680" rx="18" fill="white" stroke="#b9c8d8" stroke-width="2"/><rect width="420" height="64" rx="18" fill="#173c5b"/><text x="24" y="41" font-size="20" font-weight="700" fill="white">1 · Your courses &amp; preferences</text><text x="28" y="105" font-size="16" font-weight="700" fill="#173c5b">Planning term</text><rect x="28" y="120" width="364" height="46" rx="7" fill="#f7fafc" stroke="#afbdca"/><text x="44" y="149" font-size="16" fill="#334b60">Winter Term 2, 2027 (example)</text><text x="28" y="205" font-size="16" font-weight="700" fill="#173c5b">Completed courses</text><rect x="28" y="220" width="364" height="46" rx="7" fill="#f7fafc" stroke="#afbdca"/><text x="44" y="249" font-size="15" fill="#334b60">Search and add course…</text><rect x="28" y="280" width="95" height="32" rx="16" fill="#e8f3f8"/><text x="44" y="302" font-size="14" fill="#205576">CPEN 221</text><rect x="133" y="280" width="95" height="32" rx="16" fill="#e8f3f8"/><text x="149" y="302" font-size="14" fill="#205576">MATH 220</text><text x="28" y="354" font-size="16" font-weight="700" fill="#173c5b">In progress</text><rect x="28" y="369" width="364" height="46" rx="7" fill="#f7fafc" stroke="#afbdca"/><text x="44" y="398" font-size="15" fill="#334b60">Add current course (optional)</text><text x="28" y="462" font-size="16" font-weight="700" fill="#173c5b">Preferences (optional)</text><text x="32" y="500" font-size="15" fill="#334b60">☐ Avoid 8:00 a.m. starts</text><text x="32" y="535" font-size="15" fill="#334b60">☐ Finish early on Friday</text><text x="32" y="570" font-size="15" fill="#334b60">☐ Prefer shorter travel between classes</text><rect x="28" y="612" width="364" height="46" rx="8" fill="#167d83"/><text x="135" y="641" font-size="16" font-weight="700" fill="white">Show eligible courses →</text></g>
<path d="M493 490h38" stroke="#167d83" stroke-width="4"/><path d="m523 479 12 11-12 11" fill="none" stroke="#167d83" stroke-width="4"/>
<g transform="translate(540,150)"><rect width="420" height="680" rx="18" fill="white" stroke="#b9c8d8" stroke-width="2"/><rect width="420" height="64" rx="18" fill="#173c5b"/><text x="24" y="41" font-size="20" font-weight="700" fill="white">2 · Eligible course options</text><text x="28" y="105" font-size="15" fill="#53677a">Winter Term 2, 2027 · Data term/source shown</text><rect x="28" y="128" width="364" height="145" rx="10" fill="#f8fbfd" stroke="#c7d5e0"/><text x="46" y="161" font-size="18" font-weight="700" fill="#173c5b">CPEN 3XX · Course title</text><rect x="46" y="177" width="92" height="27" rx="13" fill="#dcf2e8"/><text x="60" y="196" font-size="13" fill="#176140">Eligible</text><text x="46" y="228" font-size="14" fill="#334b60">Prerequisites met: CPEN 221, MATH 220</text><text x="46" y="252" font-size="13" fill="#65798c">Source: official course data · term label</text><rect x="28" y="289" width="364" height="145" rx="10" fill="#f8fbfd" stroke="#c7d5e0"/><text x="46" y="322" font-size="18" font-weight="700" fill="#173c5b">CPEN 3YY · Course title</text><rect x="46" y="338" width="113" height="27" rx="13" fill="#fff1d5"/><text x="59" y="357" font-size="13" fill="#805611">Conditional</text><text x="46" y="389" font-size="14" fill="#334b60">One prerequisite is in progress</text><text x="46" y="413" font-size="13" fill="#65798c">Confirm policy before relying on this option</text><rect x="28" y="450" width="364" height="90" rx="10" fill="#fff8e8" stroke="#e5d29b"/><text x="46" y="480" font-size="14" font-weight="700" fill="#785b19">No matches?</text><text x="46" y="505" font-size="14" fill="#53677a">Edit course history or inspect unmet prerequisites.</text><rect x="28" y="612" width="364" height="46" rx="8" fill="#167d83"/><text x="131" y="641" font-size="16" font-weight="700" fill="white">Choose sections →</text></g>
